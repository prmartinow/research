<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop CPU Models & iGPU Specs (2024 – 2026) | Data List</title>
  <meta name="description" content="Complete catalog of Intel and AMD desktop CPU models with integrated graphics from 2024 to 2026, detailing CPU specifications and iGPU performance.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=optional">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=optional" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  <script>
    (function() {
      try {
        var s = localStorage.getItem("desktop_cpu_table_full_state");
        if (s) {
          var state = JSON.parse(s);
          if (state) {
            if (state.panelCollapsed) {
              document.documentElement.classList.add("init-collapsed");
            }
            var css = "";
            if (state.activeVisibleCols && Array.isArray(state.activeVisibleCols)) {
              var allCols = ["cpu", "family", "brand", "date", "platform", "coresThreads", "igpu", "arch", "computeCores", "clock"];
              var activeSet = {};
              state.activeVisibleCols.forEach(function(c) { activeSet[c] = true; });
              allCols.forEach(function(col) {
                if (!activeSet[col]) {
                  css += 'th[data-col="' + col + '"], td[data-col="' + col + '"], .col-visibility-pill[data-col="' + col + '"] { display: none !important; }\n';
                }
              });
            }
            if (state.columnWidths) {
              for (var k in state.columnWidths) {
                if (state.columnWidths[k]) {
                  css += '#table-header-row th[data-col="' + k + '"] { width: ' + state.columnWidths[k] + 'px !important; }\n';
                }
              }
            }
            if (css) {
              var style = document.createElement("style");
              style.id = "head-col-widths";
              style.textContent = css;
              document.head.appendChild(style);
            }
          }
        }
      } catch(e) {}
    })();
  </script>
  <style>
    .table-container {
      width: 100%;
      max-width: 100%;
      margin: 0 0 3rem;
      padding: 0 2rem;
    }

    /* Full-Width Clean Filter Toolbar Above Table */
    .filter-toolbar-split {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 0.8rem;
      padding: 1.25rem 1.6rem;
      background: rgba(13, 17, 26, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      backdrop-filter: blur(14px);
    }

    .filter-main-controls {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .range-selectors-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 2.2rem;
      width: 100%;
      padding-top: 1.2rem;
      margin-top: 0.8rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    @media (max-width: 900px) {
      .range-selectors-row {
        flex-direction: column;
        align-items: stretch;
        gap: 1.2rem;
      }
    }

    .range-selector-card {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      width: 260px;
      max-width: 280px;
      flex: 0 0 auto;
    }

    /* Generous Spacing for Checkbox Filters */
    .filter-main-controls {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      padding: 0.4rem 0;
    }

    .filter-row {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .filter-row-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
      min-width: 95px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .pills-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
    }

    @media (max-width: 1100px) {
      .filter-toolbar-split {
        grid-template-columns: 1fr;
      }
    }

    .filter-left-col {
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
      padding-right: 1.5rem;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 1100px) {
      .filter-left-col {
        padding-right: 0;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        padding-bottom: 1.2rem;
      }
    }

    /* Right Column: Compact 2x2 Grid for Shorter Dual Range Selectors */
    .filter-right-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem 1.5rem;
      align-content: center;
    }

    @media (max-width: 640px) {
      .filter-right-col {
        grid-template-columns: 1fr;
      }
    }



    /* Select All Category Action Button */
    .select-all-btn {
      background: transparent !important;
      border: none !important;
      color: var(--text-muted);
      font-family: var(--font-main);
      font-size: 0.78rem;
      font-weight: 400;
      height: 30px;
      padding: 0 0.4rem;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      user-select: none;
    }

    .select-all-btn:hover {
      color: var(--text-primary);
    }

    .select-all-btn.all-active {
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Frameless Text-Only Filter Buttons */
    .check-pill {
      background: transparent !important;
      border: none !important;
      color: var(--text-muted);
      font-family: var(--font-main);
      font-size: 0.82rem;
      font-weight: 400;
      height: 30px;
      padding: 0 0.45rem;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all var(--transition-fast);
      user-select: none;
    }

    .check-pill:hover {
      background: rgba(255, 255, 255, 0.04) !important;
      color: var(--text-primary);
    }

    .check-pill .checkbox-box {
      display: none;
    }

    .check-pill.active {
      background: transparent !important;
      border: none !important;
      color: #9aa8b9;
      font-weight: 500;
    }

    .col-visibility-pill {
      font-size: 0.76rem;
      padding: 0.25rem 0.6rem;
    }

    .col-visibility-pill.active {
      color: #9aa8b9 !important;
    }

    /* Ultra-Minimal Compact Dual-Thumb Range Selector */
    .range-selector-card {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-width: 240px;
    }

    .range-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .range-val {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-primary);
    }

    .dual-range-box {
      position: relative;
      width: 100%;
      height: 16px;
      display: flex;
      align-items: center;
    }

    .dual-range-box::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1px;
    }

    .range-fill {
      position: absolute;
      height: 2px;
      background: rgba(125, 211, 252, 0.6);
      border-radius: 1px;
      z-index: 1;
      pointer-events: none;
    }

    .dual-range-input {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      -webkit-appearance: none;
      appearance: none;
      background: none;
      pointer-events: none;
      z-index: 2;
      outline: none;
      margin: 0;
    }

    .dual-range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-primary);
      border: 2px solid #07090e;
      cursor: pointer;
      pointer-events: auto;
      transition: transform var(--transition-fast);
    }

    .dual-range-input::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .search-input-field {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-main);
      font-size: 0.85rem;
      font-weight: 400;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      outline: none;
      min-width: 240px;
      transition: border-color var(--transition-fast), background var(--transition-fast);
    }

    .search-input-field:focus {
      border-color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.07);
    }

    .reset-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-main);
      font-size: 0.8rem;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      cursor: pointer;
      margin-left: auto;
      transition: all var(--transition-fast);
    }

    .reset-btn:hover {
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }

    .table-card {
      width: 100%;
      min-height: 500px;
      background: rgba(13, 17, 26, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow-x: auto;
      backdrop-filter: blur(12px);
    }

    /* Table & Resizable Draggable Headers */
    table {
      width: 100%;
      min-width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-family: var(--font-main);
      font-size: 0.88rem;
      font-weight: 400;
      color: var(--text-primary);
      table-layout: fixed;
    }

    th, td {
      white-space: nowrap;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
      min-width: 0;
    }

    th {
      background: rgba(255, 255, 255, 0.025);
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-size: 0.85rem;
      font-weight: 400;
      padding: 0.8rem 0.5rem;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: background var(--transition-fast), color var(--transition-fast);
      position: relative;
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
      min-width: 0;
    }

    th .th-title-text {
      display: inline-block;
      max-width: calc(100% - 16px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }

    th:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }

    th.dragging {
      opacity: 0.4;
      background: rgba(255, 255, 255, 0.1);
    }

    th.drag-over {
      border-left: 2px solid var(--intel-color);
      background: rgba(125, 211, 252, 0.08);
    }

    th .sort-icon {
      font-size: 0.7rem;
      margin-left: 2px;
      opacity: 0.4;
      vertical-align: middle;
    }

    th.sorted .sort-icon {
      opacity: 1;
      color: var(--intel-color);
    }

    /* Column Resizer Handle */
    th .resizer {
      position: absolute;
      right: 0;
      top: 0;
      width: 8px;
      height: 100%;
      cursor: col-resize;
      user-select: none;
      z-index: 10;
      transition: background var(--transition-fast);
    }

    th .resizer:hover, th .resizer.resizing {
      background: var(--intel-color);
      opacity: 0.8;
    }

    td {
      font-family: var(--font-main);
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--text-primary);
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CPU Hyperlink Styling */
    td a.cpu-link {
      color: var(--text-primary);
      text-decoration: underline;
      text-decoration-color: rgba(255, 255, 255, 0.25);
      text-underline-offset: 4px;
      transition: color var(--transition-fast), text-decoration-color var(--transition-fast);
    }

    td a.cpu-link:hover {
      color: var(--intel-color);
      text-decoration-color: var(--intel-color);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.015);
    }



    /* Color-Coded Text Colors for Intel (Blue) and AMD (Red) - Frameless Text-Only */
    .check-pill[data-val*="AMD"].active,
    .check-pill[data-val*="Ryzen"].active,
    .check-pill[data-val*="RDNA"].active,
    .check-pill[data-val*="AM5"].active {
      background: transparent !important;
      border: none !important;
      color: #b6737e !important;
    }

    .check-pill[data-val*="Intel"].active,
    .check-pill[data-val*="Core"].active,
    .check-pill[data-val*="Xe"].active,
    .check-pill[data-val*="14th"].active,
    .check-pill[data-val*="13th"].active,
    .check-pill[data-val*="LGA"].active {
      background: transparent !important;
      border: none !important;
      color: #6b8fb7 !important;
    }

    /* Collapsible Filter Panel Header & Content Controls */
    .filter-panel-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-bottom: 0.8rem;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .filter-panel-title {
      font-family: var(--font-main);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toggle-panel-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 0.32rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all var(--transition-fast);
    }

    .toggle-panel-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .toggle-arrow {
      font-size: 0.65rem;
      transition: transform 0.25s ease;
    }

    .filter-panel-content {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 1400px;
      opacity: 1;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    html.init-collapsed #filter-panel-content,
    .filter-panel-content.collapsed {
      max-height: 0 !important;
      opacity: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    html.init-collapsed #filter-toolbar-split,
    .filter-toolbar-split.panel-collapsed {
      gap: 0 !important;
      padding-top: 0.85rem !important;
      padding-bottom: 0.85rem !important;
    }

    html.init-collapsed #filter-toolbar-split .filter-panel-header,
    .filter-toolbar-split.panel-collapsed .filter-panel-header {
      padding-bottom: 0 !important;
      margin-bottom: 0 !important;
      border-bottom: none !important;
    }
  </style>
</head>

  <main class="table-container">
    <!-- Split Filter Toolbar (Left: Checkmarks, Search & Visible Columns | Right: Compact 2x2 Dual Range Selectors) -->
    <div class="filter-toolbar-split" id="filter-toolbar-split">

    };

    const DEFAULT_COLUMN_ORDER = ["cpu", "family", "brand", "date", "platform", "coresThreads", "igpu", "arch", "computeCores", "clock"];

    const DEFAULT_COLUMN_WIDTHS = {
      cpu: 260,
      family: 220,

      date: 120,
      platform: 120,
      coresThreads: 140,
      igpu: 200,
      arch: 130,
      computeCores: 140,
      clock: 120
    };

    function loadSavedColumnOrder() {
      try {
        const saved = localStorage.getItem("desktop_cpu_column_order");
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            const merged = parsed.filter(k => DEFAULT_COLUMN_ORDER.includes(k));
            DEFAULT_COLUMN_ORDER.forEach(k => {
              if (!merged.includes(k)) merged.push(k);
            });
            return merged;
          }
        }
      } catch (e) {}
      return [...DEFAULT_COLUMN_ORDER];
    }

    function saveColumnOrder(order) {
      try { localStorage.setItem("desktop_cpu_column_order", JSON.stringify(order)); } catch (e) {}
    }

    function loadSavedColumnWidths() {
      try {
        const saved = localStorage.getItem("desktop_cpu_column_widths");
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return {};
    }

    function saveColumnWidths(widths) {
      try { localStorage.setItem("desktop_cpu_column_widths", JSON.stringify(widths)); } catch (e) {}
    }

    const STORAGE_KEY_FULL_STATE = "desktop_cpu_table_full_state";

    let columnOrder = loadSavedColumnOrder();
    let columnWidths = loadSavedColumnWidths();

    let currentSortCol = null;
    let sortState = "none";
    let draggedColKey = null;

    let mouseDownX = 0;
    let mouseDownY = 0;

    const ALL_FAMILIES = ["Ryzen 9000 Series", "Ryzen 8000 Series", "Ryzen 7000 Series", "Ryzen AI 400 Series", "Ryzen PRO 9000 Series", "Ryzen PRO 8000 Series", "Ryzen PRO 7000 Series", "Ryzen AI PRO 400 Series", "Arrow Lake-S (Core Ultra 200S)", "Nova Lake-S (Core Ultra 400S)", "Raptor Lake Refresh (14th Gen)", "Raptor Lake (13th Gen)"];

    const activeBrands = new Set(["Intel", "AMD"]);
    const activeFamilies = new Set(ALL_FAMILIES);
    const activeSockets = new Set(["AM5", "LGA 1851", "LGA 1700"]);
    const activeArchs = new Set(["RDNA 3.5", "RDNA 3", "RDNA 2", "Xe-LPG", "Xe-LP", "Xe3"]);
    
    const activeVisibleCols = new Set(DEFAULT_COLUMN_ORDER);

    let minCpuCores = 2, maxCpuCores = 24;
    let minComputeCores = 2, maxComputeCores = 32;
    let minGpuClock = 1.4, maxGpuClock = 3.1;

    let searchQuery = "";
    let isPanelCollapsed = false;
    let isInitializing = true;

    function applyPanelCollapsedUI(collapsed) {
      if (collapsed) {
        document.documentElement.classList.add("init-collapsed");
      } else {
        document.documentElement.classList.remove("init-collapsed");
      }

      const filterContent = document.getElementById("filter-panel-content");
      const filterToolbar = document.getElementById("filter-toolbar-split");
      const toggleText = document.getElementById("toggle-panel-text");
      const toggleArrow = document.getElementById("toggle-panel-arrow");

      if (filterContent) filterContent.classList.toggle("collapsed", collapsed);
      if (filterToolbar) filterToolbar.classList.toggle("panel-collapsed", collapsed);
      if (toggleText) toggleText.textContent = collapsed ? "Expand Filters" : "Collapse Filters";
      if (toggleArrow) toggleArrow.textContent = collapsed ? "▼" : "▲";
    }

    function saveTableFullState() {
      if (isInitializing) return;
      try {
        const state = {
          panelCollapsed: isPanelCollapsed,
          searchQuery: searchQuery,
          activeBrands: Array.from(activeBrands),
          activeFamilies: Array.from(activeFamilies),
          activeSockets: Array.from(activeSockets),
          activeArchs: Array.from(activeArchs),
          activeVisibleCols: Array.from(activeVisibleCols),
          minCpuCores, maxCpuCores,
          minComputeCores, maxComputeCores,
          minGpuClock, maxGpuClock,
          currentSortCol, sortState
        };
        localStorage.setItem(STORAGE_KEY_FULL_STATE, JSON.stringify(state));
      } catch (e) {}
    }

    function loadTableFullState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_FULL_STATE);
        if (!saved) return;
        const state = JSON.parse(saved);

        if (typeof state.panelCollapsed === "boolean") {
          isPanelCollapsed = state.panelCollapsed;
          applyPanelCollapsedUI(isPanelCollapsed);
        }

        if (typeof state.searchQuery === "string") {
          searchQuery = state.searchQuery;
          const searchInput = document.getElementById("search-input");
          if (searchInput) searchInput.value = searchQuery;
        }

        if (Array.isArray(state.activeBrands)) {
          activeBrands.clear();
          state.activeBrands.forEach(v => activeBrands.add(v));
        }

        if (Array.isArray(state.activeFamilies)) {
          activeFamilies.clear();
          state.activeFamilies.forEach(v => activeFamilies.add(v));
        }

        if (Array.isArray(state.activeSockets)) {
          activeSockets.clear();
          state.activeSockets.forEach(v => activeSockets.add(v));
        }

        if (Array.isArray(state.activeArchs)) {
          activeArchs.clear();
          state.activeArchs.forEach(v => activeArchs.add(v));
        }

        if (Array.isArray(state.activeVisibleCols)) {
          activeVisibleCols.clear();
          state.activeVisibleCols.forEach(v => activeVisibleCols.add(v));
        }

        if (typeof state.minCpuCores === "number") minCpuCores = state.minCpuCores;
        if (typeof state.maxCpuCores === "number") maxCpuCores = state.maxCpuCores;
        if (typeof state.minComputeCores === "number") minComputeCores = state.minComputeCores;
        if (typeof state.maxComputeCores === "number") maxComputeCores = state.maxComputeCores;
        if (typeof state.minGpuClock === "number") minGpuClock = state.minGpuClock;
        if (typeof state.maxGpuClock === "number") maxGpuClock = state.maxGpuClock;

        if (state.currentSortCol !== undefined) currentSortCol = state.currentSortCol;
        if (state.sortState !== undefined) sortState = state.sortState;
      } catch (e) {}
    }

    function parseNumericValue(val) {
      if (!val || val === "N/A") return -1;
      const match = val.match(/[\d.]+/);
      return match ? parseFloat(match[0]) : 0;
    }

    function getFilteredData() {
      const filtered = CPU_DESKTOP_MODELS.filter(item => {
        if (activeBrands.size > 0 && !activeBrands.has(item.brand)) return false;
        
        if (activeFamilies.size > 0) {
          let matchFam = false;
          for (let f of activeFamilies) {
            if (item.family.includes(f) || f.includes(item.family)) {
              matchFam = true;
              break;
            }
          }
          if (!matchFam) return false;
        }

        if (activeSockets.size > 0) {
          let matchSocket = false;
          for (let s of activeSockets) {
            if (item.platform.includes(s)) {
              matchSocket = true;
              break;
            }
          }
          if (!matchSocket) return false;
        }

        if (activeArchs.size > 0) {
          let matchArch = false;
          for (let a of activeArchs) {
            if (item.arch.includes(a)) {
              matchArch = true;
              break;
            }
          }
          if (!matchArch) return false;
        }

        const itemCpuCores = parseNumericValue(item.coresThreads);
        if (itemCpuCores >= 0 && (itemCpuCores < minCpuCores || itemCpuCores > maxCpuCores)) return false;

        const itemComputeCores = parseNumericValue(item.computeCores);
        if (itemComputeCores >= 0 && (itemComputeCores < minComputeCores || itemComputeCores > maxComputeCores)) return false;

        const itemClock = parseNumericValue(item.clock);
        if (itemClock >= 0 && (itemClock < minGpuClock || itemClock > maxGpuClock)) return false;

        if (searchQuery.trim() !== "") {
          const q = searchQuery.toLowerCase();
          const matchCpu = item.cpu.toLowerCase().includes(q);
          const matchFamily = item.family.toLowerCase().includes(q);
          const matchIgpu = item.igpu.toLowerCase().includes(q);
          const matchArch = item.arch.toLowerCase().includes(q);
          return matchCpu || matchFamily || matchIgpu || matchArch;
        }

        return true;
      });

      if (!currentSortCol || sortState === "none") {
        return filtered;
      }

      return filtered.sort((a, b) => {
        let valA = a[currentSortCol];
        let valB = b[currentSortCol];

        if (currentSortCol === "date") {
          valA = a.timestamp;
          valB = b.timestamp;
        } else if (["coresThreads", "computeCores", "clock"].includes(currentSortCol)) {
          valA = parseNumericValue(valA);
          valB = parseNumericValue(valB);
        } else {
          valA = String(valA).toLowerCase();
          valB = String(valB).toLowerCase();
        }

        if (valA < valB) return sortState === "asc" ? -1 : 1;
        if (valA > valB) return sortState === "asc" ? 1 : -1;
        return 0;
      });
    }

    function updateDualRangeUI(type, minVal, maxVal, minLimit, maxLimit) {
      const fillBar = document.getElementById(`fill-${type}`);
      const valText = document.getElementById(`val-${type}`);

      let displayMin = minVal;
      let displayMax = maxVal;
      if (type === "gpu-clock") {
        displayMin = minVal.toFixed(1);
        displayMax = maxVal.toFixed(1);
      }

      let suffix = "";
      if (type === "gpu-clock") suffix = " GHz";

      valText.textContent = `${displayMin} – ${displayMax}${suffix}`;

      const pctMin = ((minVal - minLimit) / (maxLimit - minLimit)) * 100;
      const pctMax = ((maxVal - minLimit) / (maxLimit - minLimit)) * 100;

      fillBar.style.left = `${pctMin}%`;
      fillBar.style.width = `${pctMax - pctMin}%`;
    }

    function setupDualRangeListeners(type, minLimit, maxLimit, step, isFloat = false) {
      const minInput = document.getElementById(`min-${type}`);
      const maxInput = document.getElementById(`max-${type}`);

      const updateValues = (isMinChanged) => {
        let vMin = isFloat ? parseFloat(minInput.value) : parseInt(minInput.value, 10);
        let vMax = isFloat ? parseFloat(maxInput.value) : parseInt(maxInput.value, 10);

        if (isMinChanged && vMin > vMax) {
          vMin = vMax;
          minInput.value = vMin;
        } else if (!isMinChanged && vMax < vMin) {
          vMax = vMin;
          maxInput.value = vMax;
        }

        if (type === "cpu-cores") { minCpuCores = vMin; maxCpuCores = vMax; }
        if (type === "compute-cores") { minComputeCores = vMin; maxComputeCores = vMax; }
        if (type === "gpu-clock") { minGpuClock = vMin; maxGpuClock = vMax; }

        updateDualRangeUI(type, vMin, vMax, minLimit, maxLimit);
        renderTable(getFilteredData());
        saveTableFullState();
      };

      minInput.addEventListener("input", () => updateValues(true));
      maxInput.addEventListener("input", () => updateValues(false));

      updateDualRangeUI(type, parseFloat(minInput.value), parseFloat(maxInput.value), minLimit, maxLimit);
    }

    function updateRowPillsUI(rowElement, category) {
      let activeSet;
      if (category === "brand") activeSet = activeBrands;
      if (category === "family") activeSet = activeFamilies;
      if (category === "socket") activeSet = activeSockets;
      if (category === "arch") activeSet = activeArchs;

      const pills = rowElement.querySelectorAll(".check-pill");
      let allChecked = true;

      pills.forEach(pill => {
        const val = pill.getAttribute("data-val");
        const box = pill.querySelector(".checkbox-box");
        if (activeSet.has(val)) {
          pill.classList.add("active");
          box.textContent = "✓";
        } else {
          pill.classList.remove("active");
          box.textContent = "";
          allChecked = false;
        }
      });

      const selectAllBtn = rowElement.querySelector(".select-all-btn");
      if (selectAllBtn) {
        if (allChecked && pills.length > 0) {
          selectAllBtn.classList.add("all-active");
        } else {
          selectAllBtn.classList.remove("all-active");
        }
      }
    }

    function toggleSelectAllCategory(rowElement, category) {
      let activeSet;
      let allValues = [];

      if (category === "brand") {
        activeSet = activeBrands;
        allValues = ["Intel", "AMD"];
      } else if (category === "family") {
        activeSet = activeFamilies;
        allValues = [...ALL_FAMILIES];
      } else if (category === "socket") {
        activeSet = activeSockets;
        allValues = ["AM5", "LGA 1851", "LGA 1700"];
      } else if (category === "arch") {
        activeSet = activeArchs;
        allValues = ["RDNA 3.5", "RDNA 3", "RDNA 2", "Xe-LPG", "Xe-LP", "Xe3"];
      }

      if (activeSet.size === allValues.length) {
        activeSet.clear();
      } else {
        allValues.forEach(v => activeSet.add(v));
      }

      updateRowPillsUI(rowElement, category);
      renderTable(getFilteredData());
      saveTableFullState();
    }

    function toggleIndividualPill(pillElement, category, val) {
      let activeSet;
      if (category === "brand") activeSet = activeBrands;
      if (category === "family") activeSet = activeFamilies;
      if (category === "socket") activeSet = activeSockets;
      if (category === "arch") activeSet = activeArchs;

      if (activeSet.has(val)) {
        activeSet.delete(val);
      } else {
        activeSet.add(val);
      }

      const rowElement = pillElement.closest(".filter-row");
      updateRowPillsUI(rowElement, category);
      renderTable(getFilteredData());
      saveTableFullState();
    }

    function updateColumnsVisibilityUI() {
      const colRow = document.getElementById("columns-visibility-row");
      const pills = colRow.querySelectorAll(".col-visibility-pill");
      let allChecked = true;

      pills.forEach(pill => {
        const colKey = pill.getAttribute("data-col");
        const box = pill.querySelector(".checkbox-box");
        if (activeVisibleCols.has(colKey)) {
          pill.classList.add("active");
          box.textContent = "✓";
        } else {
          pill.classList.remove("active");
          box.textContent = "";
          allChecked = false;
        }
      });

      const toggleAllBtn = document.getElementById("toggle-all-cols-btn");
      if (toggleAllBtn) {
        if (allChecked) {
          toggleAllBtn.classList.add("all-active");
        } else {
          toggleAllBtn.classList.remove("all-active");
        }
      }
    }

    function handleHeaderSortClick(colKey) {
      if (currentSortCol !== colKey) {
        currentSortCol = colKey;
        sortState = "asc";
      } else {
        if (sortState === "asc") {
          sortState = "desc";
        } else if (sortState === "desc") {
          sortState = "none";
          currentSortCol = null;
        } else {
          sortState = "asc";
        }
      }

      renderTable(getFilteredData());
      saveTableFullState();
    }

    function setupHeaderControls() {
      const headers = document.querySelectorAll("#table-header-row th");

      headers.forEach(th => {
        const colKey = th.getAttribute("data-col");
        th.setAttribute("draggable", "true");

        let resizer = th.querySelector(".resizer");
        if (!resizer) {
          resizer = document.createElement("div");
          resizer.className = "resizer";
          th.appendChild(resizer);
        }

        let startX, startWidth, nextTh, nextStartWidth, nextColKey;

        const onMouseMove = (e) => {
          const dx = e.clientX - startX;

          if (nextTh && nextColKey) {
            const totalAvailable = startWidth + nextStartWidth;
            const minColW = 12;
            const maxColW = Math.max(minColW, totalAvailable - minColW);

            let newWidth = Math.max(minColW, Math.min(maxColW, startWidth + dx));
            let nextNewWidth = totalAvailable - newWidth;

            th.style.width = `${newWidth}px`;
            nextTh.style.width = `${nextNewWidth}px`;
            columnWidths[colKey] = newWidth;
            columnWidths[nextColKey] = nextNewWidth;
          } else {
            const newWidth = Math.max(12, startWidth + dx);
            th.style.width = `${newWidth}px`;
            columnWidths[colKey] = newWidth;
          }
        };

        const onMouseUp = () => {
          resizer.classList.remove("resizing");
          document.removeEventListener("mousemove", onMouseMove);
          document.removeEventListener("mouseup", onMouseUp);
          saveColumnWidths(columnWidths);
        };

        resizer.addEventListener("mousedown", (e) => {
          e.stopPropagation();
          e.preventDefault();
          startX = e.clientX;
          startWidth = th.getBoundingClientRect().width;

          nextTh = th.nextElementSibling;
          while (nextTh && nextTh.style.display === "none") {
            nextTh = nextTh.nextElementSibling;
          }

          if (nextTh) {
            nextStartWidth = nextTh.getBoundingClientRect().width;
            nextColKey = nextTh.getAttribute("data-col");
          } else {
            nextTh = null;
            nextColKey = null;
          }

          resizer.classList.add("resizing");
          document.addEventListener("mousemove", onMouseMove);
          document.addEventListener("mouseup", onMouseUp);
        });

        th.addEventListener("mousedown", (e) => {
          mouseDownX = e.clientX;
          mouseDownY = e.clientY;
        });

        th.addEventListener("dragstart", (e) => {
          draggedColKey = colKey;
          th.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", draggedColKey);
        });

        th.addEventListener("dragend", () => {
          th.classList.remove("dragging");
          headers.forEach(h => h.classList.remove("drag-over"));
        });

        th.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          th.classList.add("drag-over");
        });

        th.addEventListener("dragleave", () => {
          th.classList.remove("drag-over");
        });

        th.addEventListener("drop", (e) => {
          e.preventDefault();
          th.classList.remove("drag-over");
          const targetColKey = th.getAttribute("data-col");

          if (draggedColKey && targetColKey && draggedColKey !== targetColKey) {
            const fromIdx = columnOrder.indexOf(draggedColKey);
            const toIdx = columnOrder.indexOf(targetColKey);

            if (fromIdx !== -1 && toIdx !== -1) {
              columnOrder.splice(fromIdx, 1);
              columnOrder.splice(toIdx, 0, draggedColKey);

              saveColumnOrder(columnOrder);
              renderTable(getFilteredData());
            }
          }
        });

        th.addEventListener("click", (e) => {
          if (e.target.classList.contains("resizer")) return;

          const distMoved = Math.hypot(e.clientX - mouseDownX, e.clientY - mouseDownY);
          if (distMoved > 4) return;

          handleHeaderSortClick(colKey);
        });
      });
    }

    function renderHeaderRow() {
      const headerRow = document.getElementById("table-header-row");

      headerRow.innerHTML = columnOrder.map(colKey => {
        const isCurrent = colKey === currentSortCol;
        let arrow = "↕";
        let sortedClass = "";

        if (isCurrent && sortState === "asc") {
          arrow = "▲";
          sortedClass = "sorted";
        } else if (isCurrent && sortState === "desc") {
          arrow = "▼";
          sortedClass = "sorted";
        }

        const isVisible = activeVisibleCols.has(colKey);
        const displayStyle = isVisible ? "" : "display:none;";
        const widthVal = columnWidths[colKey] || DEFAULT_COLUMN_WIDTHS[colKey] || 150;
        const savedWidth = `width:${widthVal}px;`;

        return `<th data-col="${colKey}" class="${sortedClass}" style="${displayStyle} ${savedWidth}">
          <span class="th-title-text">${COLUMN_DEF_MAP[colKey]}</span> <span class="sort-icon">${arrow}</span>
          <div class="resizer"></div>
        </th>`;
      }).join("");

      setupHeaderControls();
    }

    function renderTable(data) {
      renderHeaderRow();
      const tbody = document.getElementById("table-body");

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${columnOrder.length}" style="text-align:center; padding:3rem; color:var(--text-muted);">No desktop CPUs found matching your selected filters.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(item => `
        <tr>
          ${columnOrder.map(colKey => {
            const isVisible = activeVisibleCols.has(colKey);
            const displayStyle = isVisible ? "" : "display:none;";

            let content = item[colKey];
            if (colKey === "cpu") {
              content = `<a href="${item.url}" target="_blank" rel="noopener noreferrer" class="cpu-link" title="Open official ${item.cpu} specifications">${item.cpu}</a>`;
            }

            return `<td style="${displayStyle}">${content}</td>`;
          }).join("")}
        </tr>
      `).join("");

      updateColumnsVisibilityUI();
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadTableFullState();

      const minCc = document.getElementById("min-cpu-cores");
      const maxCc = document.getElementById("max-cpu-cores");
      if (minCc && maxCc) { minCc.value = minCpuCores; maxCc.value = maxCpuCores; }

      const minGpu = document.getElementById("min-compute-cores");
      const maxGpu = document.getElementById("max-compute-cores");
      if (minGpu && maxGpu) { minGpu.value = minComputeCores; maxGpu.value = maxComputeCores; }

      const minClk = document.getElementById("min-gpu-clock");
      const maxClk = document.getElementById("max-gpu-clock");
      if (minClk && maxClk) { minClk.value = minGpuClock; maxClk.value = maxGpuClock; }

      setupDualRangeListeners("cpu-cores", 2, 24, 2, false);
      setupDualRangeListeners("compute-cores", 2, 32, 1, false);
      setupDualRangeListeners("gpu-clock", 1.4, 3.1, 0.1, true);

      document.querySelectorAll(".filter-row[data-category]").forEach(row => {
        const category = row.getAttribute("data-category");
        updateRowPillsUI(row, category);

        const selectAllBtn = row.querySelector(".select-all-btn");
        if (selectAllBtn) {
          selectAllBtn.addEventListener("click", () => {
            toggleSelectAllCategory(row, category);
          });
        }

        row.querySelectorAll(".check-pill").forEach(pill => {
          pill.addEventListener("click", () => {
            const val = pill.getAttribute("data-val");
            toggleIndividualPill(pill, category, val);
          });
        });
      });

      const colPills = document.querySelectorAll(".col-visibility-pill");
      colPills.forEach(pill => {
        pill.addEventListener("click", () => {
          const colKey = pill.getAttribute("data-col");
          if (activeVisibleCols.has(colKey)) {
            if (activeVisibleCols.size > 1) {
              activeVisibleCols.delete(colKey);
            }
          } else {
            activeVisibleCols.add(colKey);
          }
          updateColumnsVisibilityUI();
          saveTableFullState();
        });
      });

      const toggleAllColsBtn = document.getElementById("toggle-all-cols-btn");
      if (toggleAllColsBtn) {
        toggleAllColsBtn.addEventListener("click", () => {
          if (activeVisibleCols.size === columnOrder.length) {
            activeVisibleCols.clear();
            activeVisibleCols.add("cpu");
          } else {
            columnOrder.forEach(k => activeVisibleCols.add(k));
          }
          updateColumnsVisibilityUI();
          saveTableFullState();
        });
      }

      const searchInput = document.getElementById("search-input");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          searchQuery = e.target.value;
          renderTable(getFilteredData());
          saveTableFullState();
        });
      }

      const resetBtn = document.getElementById("reset-filters");
      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          columnOrder = [...DEFAULT_COLUMN_ORDER];
          columnWidths = {};
          currentSortCol = null;
          sortState = "none";

          saveColumnOrder(columnOrder);
          saveColumnWidths(columnWidths);

          activeBrands.clear(); ["Intel", "AMD"].forEach(v => activeBrands.add(v));
          activeFamilies.clear(); ALL_FAMILIES.forEach(v => activeFamilies.add(v));
          activeSockets.clear(); ["AM5", "LGA 1851", "LGA 1700"].forEach(v => activeSockets.add(v));
          activeArchs.clear(); ["RDNA 3.5", "RDNA 3", "RDNA 2", "Xe-LPG", "Xe-LP", "Xe3"].forEach(v => activeArchs.add(v));
          columnOrder.forEach(k => activeVisibleCols.add(k));

          minCpuCores = 2; maxCpuCores = 24;
          minComputeCores = 2; maxComputeCores = 32;
          minGpuClock = 1.4; maxGpuClock = 3.1;
          searchQuery = "";

          if (searchInput) searchInput.value = "";

          const minCc = document.getElementById("min-cpu-cores");
          const maxCc = document.getElementById("max-cpu-cores");
          if (minCc && maxCc) { minCc.value = 2; maxCc.value = 24; updateDualRangeUI("cpu-cores", 2, 24, 2, 24); }

          const minGpu = document.getElementById("min-compute-cores");
          const maxGpu = document.getElementById("max-compute-cores");
          if (minGpu && maxGpu) { minGpu.value = 2; maxGpu.value = 32; updateDualRangeUI("compute-cores", 2, 32, 2, 32); }

          const minClk = document.getElementById("min-gpu-clock");
          const maxClk = document.getElementById("max-gpu-clock");
          if (minClk && maxClk) { minClk.value = 1.4; maxClk.value = 3.1; updateDualRangeUI("gpu-clock", 1.4, 3.1, 1.4, 3.1); }

          document.querySelectorAll(".filter-row[data-category]").forEach(row => {
            const category = row.getAttribute("data-category");
            updateRowPillsUI(row, category);
          });

          isPanelCollapsed = false;
          applyPanelCollapsedUI(false);
          renderTable(getFilteredData());
          saveTableFullState();
        });
      }

      // Collapsible Filter Panel Toggle
      const toggleBtn = document.getElementById("toggle-filter-panel-btn");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          isPanelCollapsed = !isPanelCollapsed;
          applyPanelCollapsedUI(isPanelCollapsed);
          saveTableFullState();
        });
      }

      renderTable(getFilteredData());
      isInitializing = false;
    });
</script>
</body>
</html>
