<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPU & iGPU Generations Timeline (2020 – 2026+) | Roadmap UI</title>
  <meta name="description" content="Horizontal timeline tracking Intel and AMD CPU generations and integrated graphics (iGPU) architectures with detail modal cards.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=optional">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=optional" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "@electric-sql/pglite": "https://cdn.jsdelivr.net/npm/@electric-sql/pglite/dist/index.js"
      }
    }
  </script>
  <style>


    .timeline-container {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0 2rem;
    }

    /* Timeline Filter Toolbar (Rounded Glass Card Matching Data Table Page) */
    .timeline-filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.8rem 2rem;
      width: 100%;
      margin-bottom: 0.8rem;
      padding: 0.75rem 1.6rem;
      background: rgba(13, 17, 26, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      backdrop-filter: blur(14px);
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .filter-group-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-right: 0.2rem;
    }

    .t-pill {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-main);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all var(--transition-fast);
      user-select: none;
    }

    .t-pill:hover {
      border-color: rgba(255, 255, 255, 0.18);
      color: var(--text-primary);
    }

    /* Soothing Eye-Friendly "All" Active Filter Pill (No Stark White) */
    .t-pill.active {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Brand Filter Pills Accent Colors: Intel (Soft Blue) & AMD (Soft Rose/Red) */
    .t-pill[data-brand="intel"] {
      border-color: rgba(125, 211, 252, 0.4);
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.04);
    }

    .t-pill[data-brand="intel"]:hover,
    .t-pill[data-brand="intel"].active {
      border-color: var(--intel-color) !important;
      color: #ffffff !important;
      background: rgba(125, 211, 252, 0.12) !important;
      box-shadow: 0 0 10px var(--intel-glow) !important;
      font-weight: 500;
    }

    .t-pill[data-brand="amd"] {
      border-color: rgba(253, 164, 175, 0.4);
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.04);
    }

    .t-pill[data-brand="amd"]:hover,
    .t-pill[data-brand="amd"].active {
      border-color: var(--amd-color) !important;
      color: #ffffff !important;
      background: rgba(253, 164, 175, 0.12) !important;
      box-shadow: 0 0 10px var(--amd-glow) !important;
      font-weight: 500;
    }

    /* Modal Overlay & Card in Window Center */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(7, 9, 14, 0.8);
      backdrop-filter: blur(16px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      padding: 1.5rem;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: #0d111a;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      width: 100%;
      max-width: 920px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2.8rem 3.2rem;
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.85);
      position: relative;
      transform: scale(0.92);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    .modal-overlay.open .modal-card {
      transform: scale(1);
    }

    .modal-close-btn {
      position: absolute;
      top: 1.6rem;
      right: 1.8rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .modal-close-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .modal-badges {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1.1rem;
    }

    .modal-badge-type,
    .modal-badge-brand {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.25rem 0.7rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
    }

    .modal-title {
      font-family: var(--font-main);
      font-size: 1.4rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 0.35rem;
      line-height: 1.25;
    }

    .modal-subtitle {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 1.6rem;
      line-height: 1.45;
    }

    /* Spacious 2-Column Multi-Metric Grid */
    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 1.5rem 1.8rem;
      margin-bottom: 1.6rem;
    }

    .modal-detail-item {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      background: transparent;
      border: none;
      padding: 0;
    }

    /* Soothing, Eye-Friendly Section Titles (Clean Text without Dots) */
    .modal-detail-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      color: #7dd3fc;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }

    .modal-detail-val {
      font-size: 0.86rem;
      color: #cbd5e1;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: 0.01em;
    }

    .modal-highlights-title {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      color: #7dd3fc;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      opacity: 0.9;
    }

    .modal-highlights-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 1.4rem 1.8rem;
    }

    .modal-highlights-list li {
      font-size: 0.86rem;
      color: #e2e8f0;
      padding-left: 1.3rem;
      position: relative;
      line-height: 1.6;
      letter-spacing: 0.01em;
    }

    .modal-highlights-list li::before {
      content: '•';
      position: absolute;
      left: 0.3rem;
      color: var(--intel-color);
    }
  </style>
</head>
<body>

  <!-- Minimal Header with Navigation Tabs -->
  <header class="header">
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab-btn active">Timeline</a>
      <a href="table.html" class="nav-tab-btn">Data Table</a>
      <a href="notes.html" class="nav-tab-btn">Release Notes</a>
      <a href="explorer.html" class="nav-tab-btn">Database Explorer</a>
    </div>
  </header>

  <!-- Interactive Timeline Filter Bar -->
  <div class="timeline-container">
    <div class="timeline-filter-bar">
      <div class="filter-group">
        <span class="filter-group-label">Category:</span>
        <button class="t-pill active" data-type="all">All</button>
        <button class="t-pill" data-type="cpu">CPU</button>
        <button class="t-pill" data-type="igpu">iGPU</button>
      </div>

      <div class="filter-group">
        <span class="filter-group-label">Brand:</span>
        <button class="t-pill active" data-brand="all">All</button>
        <button class="t-pill" data-brand="intel">Intel</button>
        <button class="t-pill" data-brand="amd">AMD</button>
      </div>
    </div>
  </div>

  <!-- Main Horizontal Timeline Track -->
  <div class="timeline-main-container">
    <div class="watermark-label top">CPUs</div>
    <div class="watermark-label bottom">iGPUs</div>
    <main class="timeline-viewport" id="timeline-viewport">
      <div class="timeline-track-wrapper" id="timeline-track">
        <!-- Dynamic minimalist horizontal generation nodes rendered via app.js -->
      </div>
    </main>
  </div>

  <!-- Detail Modal Dialog Overlay -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal-card" id="modal-card">
      <button class="modal-close-btn" id="modal-close-btn" aria-label="Close details">&times;</button>
      <div id="modal-content">
        <!-- Rendered dynamically via app.js -->
      </div>
    </div>
  </div>


  <script type="module" src="app.js"></script>
</body>
</html>
