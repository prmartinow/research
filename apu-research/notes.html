<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Release Notes — APU & Desktop Processors Research</title>
  <meta name="description" content="Official launch press releases for Intel & AMD desktop processors and integrated graphics with verified specifications and official press links powered by PGlite WASM Postgres.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "@electric-sql/pglite": "https://cdn.jsdelivr.net/npm/@electric-sql/pglite/dist/index.js"
      }
    }
  </script>
  <style>
    .notes-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 5rem 1.5rem;
    }

    /* Filter Panel Styling matching Timeline / Table Filter Bar */
    .timeline-filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.8rem 2rem;
      width: 100%;
      margin: 1.2rem auto 2.5rem auto;
      padding: 0.75rem 1.6rem;
      background: rgba(13, 17, 26, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      backdrop-filter: blur(14px);
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .filter-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 0.2rem;
    }

    .t-pill {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-main);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all var(--transition-fast);
      user-select: none;
    }

    .t-pill:hover {
      border-color: rgba(255, 255, 255, 0.18);
      color: var(--text-primary);
    }

    .t-pill.active {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text-primary);
      font-weight: 500;
    }

    .t-pill[data-notes-brand="intel"] {
      border-color: rgba(125, 211, 252, 0.4);
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.04);
    }

    .t-pill[data-notes-brand="intel"]:hover,
    .t-pill[data-notes-brand="intel"].active {
      border-color: var(--intel-color) !important;
      color: #ffffff !important;
      background: rgba(56, 189, 248, 0.18) !important;
    }

    .t-pill[data-notes-brand="amd"] {
      border-color: rgba(253, 164, 175, 0.4);
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.04);
    }

    .t-pill[data-notes-brand="amd"]:hover,
    .t-pill[data-notes-brand="amd"].active {
      border-color: var(--amd-color) !important;
      color: #ffffff !important;
      background: rgba(251, 113, 133, 0.18) !important;
    }

    /* Press Release Article Container */
    .release-article {
      background: rgba(13, 17, 26, 0.65);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 2.2rem 2.5rem;
      margin-bottom: 2.5rem;
      backdrop-filter: blur(12px);
      transition: all var(--transition-medium);
      scroll-margin-top: 5rem;
    }

    .release-article:target,
    .release-article.highlighted {
      border-color: var(--intel-color);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.25);
    }

    .release-article[data-brand="amd"]:target,
    .release-article[data-brand="amd"].highlighted {
      border-color: var(--amd-color);
      box-shadow: 0 0 35px rgba(251, 113, 133, 0.25);
    }

    .article-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 1.2rem;
      margin-bottom: 1.5rem;
    }

    /* Top-Right Release Date Badge */
    .article-date-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.6rem;
    }

    .article-date-badge {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
    }

    .article-headline {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    .article-subheadline {
      font-size: 0.96rem;
      color: var(--text-secondary);
      font-weight: 400;
      line-height: 1.45;
    }

    .article-body {
      color: var(--text-secondary);
      font-size: 0.92rem;
      line-height: 1.65;
    }

    .article-body p {
      margin-bottom: 1.1rem;
    }

    .article-dateline-prefix {
      font-weight: 600;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Key Specs Table within Article */
    .article-specs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.9rem;
      margin: 1.6rem 0;
      padding: 1.2rem 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-md);
    }

    .spec-item-box {
      display: flex;
      flex-direction: column;
    }

    .spec-item-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #7dd3fc;
      margin-bottom: 0.25rem;
    }

    .spec-item-value {
      font-size: 0.85rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Executive Quote Box */
    .executive-quote {
      border-left: 3px solid var(--intel-color);
      padding: 1rem 1.4rem;
      margin: 1.6rem 0;
      background: rgba(56, 189, 248, 0.03);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-style: italic;
      color: var(--text-primary);
      line-height: 1.55;
    }

    .release-article[data-brand="amd"] .executive-quote {
      border-left-color: var(--amd-color);
      background: rgba(251, 113, 133, 0.03);
    }

    .quote-author {
      display: block;
      margin-top: 0.5rem;
      font-style: normal;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .article-highlights-title {
      font-size: 0.90rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 1.5rem 0 0.7rem 0;
    }

    .article-highlights-list {
      list-style-type: square;
      padding-left: 1.3rem;
      color: var(--text-secondary);
    }

    .article-highlights-list li {
      margin-bottom: 0.45rem;
      line-height: 1.5;
    }

    /* Official Reference URL Box */
    .article-source-box {
      margin-top: 1.8rem;
      padding: 0.85rem 1.2rem;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .source-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .source-link {
      color: var(--intel-color);
      font-size: 0.84rem;
      font-weight: 500;
      text-decoration: none;
      transition: color var(--transition-fast);
      word-break: break-all;
    }

    .release-article[data-brand="amd"] .source-link {
      color: var(--amd-color);
    }

    .source-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Minimal Header with Navigation Tabs -->
  <header class="header">
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab-btn">Timeline</a>
      <a href="table.html" class="nav-tab-btn">Data Table</a>
      <a href="notes.html" class="nav-tab-btn active">Release Notes</a>
      <a href="explorer.html" class="nav-tab-btn">Database Explorer</a>
    </div>
  </header>

  <main class="notes-container">

    <!-- Interactive Filter & Sort Panel -->
    <div class="timeline-filter-bar">
      <div class="filter-group">
        <span class="filter-label">Category:</span>
        <button class="t-pill active" data-notes-type="all">All</button>
        <button class="t-pill" data-notes-type="cpu">CPUs</button>
        <button class="t-pill" data-notes-type="igpu">iGPUs</button>
      </div>

      <div class="filter-group">
        <span class="filter-label">Brand:</span>
        <button class="t-pill active" data-notes-brand="all">All</button>
        <button class="t-pill" data-notes-brand="intel">Intel</button>
        <button class="t-pill" data-notes-brand="amd">AMD</button>
      </div>

      <div class="filter-group">
        <span class="filter-label">Order:</span>
        <button class="t-pill active" id="sort-desc-btn">Newest First ▼</button>
        <button class="t-pill" id="sort-asc-btn">Oldest First ▲</button>
      </div>
    </div>

    <!-- ARTICLES ARCHIVE CONTAINER -->
    <div id="articles-container"></div>

  </main>

  <script type="module">
    import { initDatabase, getReleases } from './db.js';

    let currentBrand = 'all';
    let currentType = 'all';
    let currentSort = 'desc';

    document.addEventListener('DOMContentLoaded', async () => {
      await initDatabase();
      await renderArticlesFromPostgres();
      setupFilterListeners();

      if (window.location.hash) {
        const hashId = window.location.hash.substring(1);
        setTimeout(() => {
          const targetEl = document.getElementById(hashId);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth' });
            targetEl.classList.add('highlighted');
            setTimeout(() => {
              targetEl.classList.remove('highlighted');
            }, 2500);
          }
        }, 300);
      }
    });

    async function renderArticlesFromPostgres() {
      const container = document.getElementById('articles-container');
      if (!container) return;

      // Query PGlite WASM Postgres directly using SQL
      const filtered = await getReleases(currentBrand, currentType, currentSort);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 6rem 1rem; color: var(--text-muted); font-size: 0.95rem;">
            No release notes match your selected filter criteria.
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach(art => {
        const specsList = typeof art.specs === 'string' ? JSON.parse(art.specs) : (art.specs || []);
        let specsHtml = '';
        if (specsList && specsList.length > 0) {
          const specItems = specsList.map(s => `
            <div class="spec-item-box">
              <span class="spec-item-label">${s.label}</span>
              <span class="spec-item-value">${s.val}</span>
            </div>
          `).join('');
          specsHtml = `<div class="article-specs-grid">${specItems}</div>`;
        }

        let quoteHtml = '';
        if (art.quote) {
          quoteHtml = `
            <div class="executive-quote">
              ${art.quote}
              <span class="quote-author">${art.quote_author || ''}</span>
            </div>
          `;
        }

        const highlightsList = typeof art.highlights === 'string' ? JSON.parse(art.highlights) : (art.highlights || []);
        let highlightsHtml = '';
        if (highlightsList && highlightsList.length > 0) {
          const items = highlightsList.map(h => `<li>${h}</li>`).join('');
          highlightsHtml = `
            <h3 class="article-highlights-title">Key Architectural Features</h3>
            <ul class="article-highlights-list">
              ${items}
            </ul>
          `;
        }

        let sourceHtml = '';
        if (art.source_url) {
          sourceHtml = `
            <div class="article-source-box">
              <span class="source-label">Official Press Release Reference:</span>
              <a href="${art.source_url}" target="_blank" rel="noopener noreferrer" class="source-link">
                ${art.source_title || 'Official Press Release'} ↗
              </a>
            </div>
          `;
        }

        html += `
          <article class="release-article" id="${art.id}" data-brand="${art.brand}" data-type="${art.category}">
            <div class="article-header">
              <div class="article-date-row">
                <span class="article-date-badge">${art.date_str}</span>
              </div>
              <h2 class="article-headline">${art.headline}</h2>
              <p class="article-subheadline">${art.subheadline || ''}</p>
            </div>

            <div class="article-body">
              ${art.body_text}
              ${specsHtml}
              ${quoteHtml}
              ${highlightsHtml}
              ${sourceHtml}
            </div>
          </article>
        `;
      });

      container.innerHTML = html;
    }

    function setupFilterListeners() {
      document.querySelectorAll('[data-notes-type]').forEach(pill => {
        pill.addEventListener('click', async () => {
          document.querySelectorAll('[data-notes-type]').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentType = pill.getAttribute('data-notes-type');
          await renderArticlesFromPostgres();
        });
      });

      document.querySelectorAll('[data-notes-brand]').forEach(pill => {
        pill.addEventListener('click', async () => {
          document.querySelectorAll('[data-notes-brand]').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentBrand = pill.getAttribute('data-notes-brand');
          await renderArticlesFromPostgres();
        });
      });

      const sortDescBtn = document.getElementById('sort-desc-btn');
      const sortAscBtn = document.getElementById('sort-asc-btn');

      if (sortDescBtn && sortAscBtn) {
        sortDescBtn.addEventListener('click', async () => {
          sortDescBtn.classList.add('active');
          sortAscBtn.classList.remove('active');
          currentSort = 'desc';
          await renderArticlesFromPostgres();
        });

        sortAscBtn.addEventListener('click', async () => {
          sortAscBtn.classList.add('active');
          sortDescBtn.classList.remove('active');
          currentSort = 'asc';
          await renderArticlesFromPostgres();
        });
      }
    }
  </script>
</body>
</html>
